model:
  vocab_size: 4096
  d_model: 256
  n_heads: 4
  n_layers: 4
  d_ff: 1024
  max_seq_len: 512
  dropout: 0.1

training:
  batch_size: 4
  learning_rate: 0.0001
  weight_decay: 0.01
  max_steps: 800
  eval_interval: 100
  save_interval: 200
  warmup_steps: 50
  grad_clip: 1.0

data:
  train_file: data/text/instruction_chat.txt
  chat_file: data/text/instruction_chat.txt
  code_file: data/text/sample_code.jsonl
  learned_file: data/text/learned_corpus.txt
  val_split: 0.05

inference:
  max_new_tokens: 256
  temperature: 0.7
  top_k: 40
  top_p: 0.9
