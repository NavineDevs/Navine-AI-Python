model:
  vocab_size: 12000
  d_model: 1664
  n_heads: 16
  n_layers: 30
  d_ff: 6656
  max_seq_len: 2048
  dropout: 0.08
  use_rope: true
  use_kv_cache: true
  use_swiglu: true
  use_rms_norm: true
  tie_embeddings: true

tokenizer:
  use_bpe: true

training:
  batch_size: 1
  learning_rate: 0.00006
  weight_decay: 0.1
  max_steps: 48000
  eval_interval: 500
  save_interval: 200
  warmup_steps: 600
  grad_clip: 1.0
  grad_accum_steps: 48
  mixed_precision: true
  sft_mask: true
  tensorboard: false
  train_seq_len: 96
  gradient_checkpointing: true
  optimizer: cpu_adamw
  max_eval_batches: 2

data:
  train_file: data/text/instruction_chat.txt
  code_file: data/text/sample_code.jsonl
  learned_file: data/text/learned_corpus.txt
  val_split: 0.08
  use_data_pipeline: true
  pipeline_folders:
    - data/text
    - data/train/chat
    - data/train/general
    - data/train/coding
    - data/train/thinking
    - data/train/detective
    - data/train/unrestricted
    - data/train/nsfw
    - data/learn
    - data/conversations

inference:
  max_new_tokens: 320
  min_new_tokens: 4
  temperature: 0.5
  top_k: 40
  top_p: 0.88
  repetition_penalty: 1.18
  frequency_penalty: 0.35
  no_repeat_ngram_size: 4
  num_candidates: 1
  modes:
    chat:
      max_new_tokens: 200
      min_new_tokens: 4
      temperature: 0.52
      top_k: 40
      top_p: 0.88
      repetition_penalty: 1.2
      frequency_penalty: 0.4
      no_repeat_ngram_size: 4
      num_candidates: 2
    think:
      max_new_tokens: 360
      min_new_tokens: 8
      temperature: 0.33
      top_k: 30
      top_p: 0.85
      repetition_penalty: 1.22
      frequency_penalty: 0.45
      no_repeat_ngram_size: 5
      num_candidates: 3
    detective:
      max_new_tokens: 440
      min_new_tokens: 12
      temperature: 0.3
      top_k: 28
      top_p: 0.84
      repetition_penalty: 1.24
      frequency_penalty: 0.5
      no_repeat_ngram_size: 5
      num_candidates: 3
    code:
      max_new_tokens: 512
      min_new_tokens: 12
      temperature: 0.18
      top_k: 30
      top_p: 0.9
      repetition_penalty: 1.08
      frequency_penalty: 0.15
      no_repeat_ngram_size: 0
      num_candidates: 1
    analyze:
      max_new_tokens: 400
      min_new_tokens: 10
      temperature: 0.3
      top_k: 35
      top_p: 0.87
      repetition_penalty: 1.2
      frequency_penalty: 0.4
      no_repeat_ngram_size: 4
      num_candidates: 2
