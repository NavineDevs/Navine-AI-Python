model:
  vocab_size: 12000
  d_model: 768
  n_heads: 12
  n_layers: 16
  d_ff: 4096
  max_seq_len: 1024
  dropout: 0.08
  use_rope: true
  use_kv_cache: true
  use_swiglu: true
  use_rms_norm: true
  tie_embeddings: true

tokenizer:
  use_bpe: true

training:
  batch_size: auto
  learning_rate: 0.00014
  weight_decay: 0.08
  max_steps: 32000
  eval_interval: 200
  save_interval: 100
  warmup_steps: 500
  grad_clip: 1.0
  grad_accum_steps: 12
  mixed_precision: true
  sft_mask: true
  tensorboard: false
  train_seq_len: 448

data:
  train_file: data/text/instruction_chat.txt
  code_file: data/text/sample_code.jsonl
  learned_file: data/text/learned_corpus.txt
  val_split: 0.08
  use_data_pipeline: true
  use_multilingual: true
  pipeline_folders:
    - data/text
    - data/train/chat
    - data/train/multilingual
    - data/train/general
    - data/train/coding
    - data/train/thinking
    - data/train/detective
    - data/train/osint
    - data/train/unrestricted
    - data/train/nsfw
    - data/train/gpt3_scale
    - data/learn
    - data/conversations

inference:
  max_new_tokens: 240
  min_new_tokens: 4
  temperature: 0.48
  top_k: 40
  top_p: 0.88
  repetition_penalty: 1.2
  frequency_penalty: 0.4
  no_repeat_ngram_size: 4
  num_candidates: 1
  modes:
    chat:
      max_new_tokens: 160
      min_new_tokens: 4
      temperature: 0.48
      top_k: 35
      top_p: 0.86
      repetition_penalty: 1.22
      frequency_penalty: 0.45
      no_repeat_ngram_size: 4
      num_candidates: 1
    think:
      max_new_tokens: 280
      min_new_tokens: 8
      temperature: 0.32
      top_k: 30
      top_p: 0.85
      repetition_penalty: 1.24
      frequency_penalty: 0.45
      no_repeat_ngram_size: 5
      num_candidates: 1
    detective:
      max_new_tokens: 360
      min_new_tokens: 12
      temperature: 0.3
      top_k: 28
      top_p: 0.84
      repetition_penalty: 1.24
      frequency_penalty: 0.5
      no_repeat_ngram_size: 5
      num_candidates: 1
    osint:
      max_new_tokens: 460
      min_new_tokens: 12
      temperature: 0.3
      top_k: 30
      top_p: 0.85
      repetition_penalty: 1.22
      frequency_penalty: 0.48
      no_repeat_ngram_size: 5
      num_candidates: 1
    code:
      max_new_tokens: 448
      min_new_tokens: 12
      temperature: 0.16
      top_k: 28
      top_p: 0.9
      repetition_penalty: 1.06
      frequency_penalty: 0.12
