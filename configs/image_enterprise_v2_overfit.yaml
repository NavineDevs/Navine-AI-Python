checkpoint_namespace: image_enterprise_v2
migration: |
  Temporary overfit diagnostic on curated tiny set.
  Resumes image_enterprise_v2 weights (fresh_start false).
  Does not change the live UI namespace.
model:
  image_size: 256
  in_channels: 3
  base_channels: 160
  channel_mults:
  - 1
  - 2
  - 4
  - 4
  num_res_blocks: 2
  time_emb_dim: 640
  text_emb_dim: 320
  attn_resolutions:
  - 32
  - 16
  text_max_len: 77
  text_layers: 4
  text_heads: 8
  min_snr_gamma: 5.0
  arch_version: 3
diffusion:
  timesteps: 200
  beta_start: 0.0001
  beta_end: 0.05
  beta_schedule: linear
training:
  batch_size: 2
  learning_rate: 0.00012
  max_steps: 2500
  save_interval: 250
  grad_clip: 1.0
  finetune_steps: 2500
  finetune_lr: 0.0001
  fresh_start: false
  photoreal_training: true
  sample_interval: 250
  cfg_dropout: 0.05
  ema_decay: 0.995
  mixed_precision: true
  torch_compile: false
  max_files_per_dir: 0
  oversample_categories:
    hentai: 24
    porn: 20
    human: 16
    sky: 20
data:
  train_dir: data/image/overfit_hentai
  extra_dirs:
  - data/image/overfit_hentai8
  - data/image/overfit_sky
  - data/image/overfit_porn
  - data/image/overfit_human
inference:
  num_steps: 80
  guidance_scale: 2.0
  seed: 0
  output_size: 256
  prefer_trained_model: true
  custom_trained_only: true
  prefer_reference_output: false
  allow_reference_fallback: false
  allow_reference_on_noise: false
  allow_procedural_on_noise: false
  prefer_procedural_simple_scenes: false
  seed_from_reference: false
  init_noise_strength: 0.25
  seeded_num_steps: 40
  procedural_only_when_untrained: false
  apply_reference_guide: false
  backend_order:
  - checkpoint
  diffusers:
    enabled: false
    requires_gpu: true
    pipeline: stable_diffusion
    model_id: ""
    local_files_only: true
    width: 256
    height: 256
    num_inference_steps: 30
    guidance_scale: 2.0
    negative_prompt: "blurry, low quality, deformed, ugly, bad anatomy, watermark, text, logo"
  scheduler: ddim
  postprocess: false
  postprocess_upscale: false
