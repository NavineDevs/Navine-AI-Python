model:
  vocab_size: 12000
  d_model: 768
  n_heads: 12
  n_layers: 16
  d_ff: 4096
  max_seq_len: 1024
  dropout: 0.08
  use_rope: true
  use_kv_cache: true
  use_swiglu: true
  use_rms_norm: true
  tie_embeddings: true

tokenizer:
  use_bpe: true

training:
  batch_size: 1
  learning_rate: 0.00012
  weight_decay: 0.08
  max_steps: 24000
  eval_interval: 200
  save_interval: 200
  warmup_steps: 200
  grad_clip: 1.0
  grad_accum_steps: 16
  mixed_precision: true
  sft_mask: true
  tensorboard: false
  train_seq_len: 256

data:
  train_file: data/text/code_sft.txt
  code_file: data/text/sample_code.jsonl
  val_split: 0.05
  use_data_pipeline: true
  pipeline_folders:
    - data/train/coding
    - data/text

inference:
  max_new_tokens: 448
  min_new_tokens: 12
  temperature: 0.16
  top_k: 28
  top_p: 0.9
  repetition_penalty: 1.06
  frequency_penalty: 0.12
  no_repeat_ngram_size: 0
  num_candidates: 1
  modes:
    code:
      max_new_tokens: 448
      min_new_tokens: 12
      temperature: 0.16
      top_k: 28
      top_p: 0.9
      repetition_penalty: 1.06
      frequency_penalty: 0.12
      no_repeat_ngram_size: 0
      num_candidates: 1
