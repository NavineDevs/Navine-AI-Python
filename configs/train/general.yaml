model:
  vocab_size: 4096
  d_model: 256
  n_heads: 4
  n_layers: 4
  d_ff: 1024
  max_seq_len: 512
  dropout: 0.1

training:
  batch_size: 8
  learning_rate: 0.0003
  weight_decay: 0.01
  max_steps: 500
  eval_interval: 500
  save_interval: 250
  warmup_steps: 50
  grad_clip: 1.0

data:
  train_file: data/train/general/corpus.txt
  learned_file: data/text/learned_corpus.txt
  val_split: 0.1

inference:
  max_new_tokens: 256
  temperature: 0.8
  top_k: 40
  top_p: 0.9
