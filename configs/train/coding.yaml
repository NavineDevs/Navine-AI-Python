model:
  vocab_size: 4096
  d_model: 256
  n_heads: 4
  n_layers: 4
  d_ff: 1024
  max_seq_len: 512
  dropout: 0.1

training:
  batch_size: auto
  learning_rate: 0.00005
  weight_decay: 0.01
  max_steps: 600
  eval_interval: 100
  save_interval: 200
  warmup_steps: 30
  grad_clip: 1.0

data:
  train_dir: data/train/coding
  train_file: data/train/coding/python.jsonl
  val_split: 0.1

inference:
  max_new_tokens: 512
  temperature: 0.5
  top_k: 40
  top_p: 0.9
