model:
  vocab_size: 4096
  d_model: 256
  n_heads: 4
  n_layers: 4
  d_ff: 1024
  max_seq_len: 512
  dropout: 0.1

training:
  batch_size: 4
  learning_rate: 0.00008
  weight_decay: 0.01
  max_steps: 900
  eval_interval: 400
  save_interval: 200
  warmup_steps: 40
  grad_clip: 1.0

data:
  train_file: data/train/detective/mysteries.txt
  extra_file: data/train/detective/ciphers.jsonl
  val_split: 0.1

inference:
  max_new_tokens: 420
  temperature: 0.32
  top_k: 28
  top_p: 0.84
